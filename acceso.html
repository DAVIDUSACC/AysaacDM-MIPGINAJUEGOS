<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aysaac_DM | ¡Casi listo!</title>
  <link rel="icon" href="images/logo.ico.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --bg:#0a0f1b; --surface:#111829; --surface-2:#18213a;
      --line:#222c47; --line-strong:#33406a;
      --text:#e9eef9; --muted:#93a0bf;
      --accent:#3bd6ff; --accent-ink:#031017;
      --yt:#ff3d3d; --ig:#e1306c; --ok:#37d67a;
      --font-display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      font-family:var(--font-body);color:var(--text);
      background:
        radial-gradient(circle at 20% 10%,rgba(59,214,255,.12),transparent 45%),
        radial-gradient(circle at 80% 90%,rgba(255,61,61,.10),transparent 45%),
        var(--bg);
    }
    .gate{
      width:100%;max-width:560px;padding:40px 40px 36px;
      background:var(--surface);border:1px solid var(--line-strong);border-radius:24px;
      box-shadow:0 24px 80px rgba(0,0,0,.55);
    }
    .gate h1{font-family:var(--font-display);font-size:30px;text-align:center}
    .gate .sub{margin:10px auto 28px;max-width:40ch;text-align:center;color:#b9c4de}

    .step{
      display:flex;align-items:center;gap:16px;width:100%;margin-bottom:16px;padding:20px 22px;
      border-radius:16px;border:1px solid;text-align:left;font:inherit;color:var(--text);
      font-family:var(--font-display);font-weight:600;font-size:18px;cursor:pointer;
      transition:transform .2s,border-color .2s,background .2s;
    }
    .step:hover{transform:translateY(-2px)}
    .step i.ico{font-size:26px;width:30px;text-align:center}
    .step .label{flex:1}
    .step .state{font-size:14px;font-weight:500;color:var(--muted)}
    .step.yt{background:rgba(255,61,61,.14);border-color:rgba(255,61,61,.55)}
    .step.ig{background:rgba(225,48,108,.14);border-color:rgba(225,48,108,.55)}
    .step.yt .ico{color:var(--yt)} .step.ig .ico{color:var(--ig)}
    .step.checking{opacity:.85;pointer-events:none}
    .step.done{background:rgba(55,214,122,.12);border-color:rgba(55,214,122,.6);pointer-events:none}
    .step.done .ico,.step.done .state{color:var(--ok)}

    .progress{margin:26px 0 22px}
    .progress-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
    .bar{height:8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
    .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}

    .go{
      display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;
      border-radius:16px;border:1px solid var(--line-strong);
      font-family:var(--font-display);font-weight:600;font-size:18px;text-decoration:none;
      background:var(--surface-2);color:var(--muted);pointer-events:none;transition:all .25s;
    }
    .go.open{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);pointer-events:auto;cursor:pointer}
    .go.open:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,214,255,.3)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(max-width:520px){.gate{padding:28px 20px}.gate h1{font-size:26px}.step{font-size:16px;padding:16px}}
  </style>
</head>
<body>

  <main class="gate">
    <h1>¡Casi listo!</h1>
    <p class="sub">Completa los siguientes pasos para desbloquear el enlace a la página de juegos.</p>

    <button class="step yt" type="button" id="stepYt" data-url="https://www.youtube.com/@SoyAysaacDM">
      <i class="fa-brands fa-youtube ico"></i>
      <span class="label">Suscribirse al canal</span>
      <span class="state"></span>
    </button>

    <button class="step ig" type="button" id="stepIg" data-url="https://www.instagram.com/soydavidbm/">
      <i class="fa-brands fa-instagram ico"></i>
      <span class="label">Seguir en Instagram</span>
      <span class="state"></span>
    </button>

    <div class="progress">
      <div class="progress-top"><span>Progreso de validación</span><span id="count">0/2 Completados</span></div>
      <div class="bar"><span id="fill"></span></div>
    </div>

    <a class="go" id="go" href="index.html" aria-disabled="true">
      <i class="fa-solid fa-lock" id="goIcon"></i><span id="goText">Enlace bloqueado</span>
    </a>
  </main>

<script>
const GAMES_PAGE = "index.html";   // página de juegos
const WAIT_MS = 6000;              // segundos que debe pasar antes de marcar el paso como hecho
const KEY = "aysaac_unlocked";

const steps = [document.getElementById("stepYt"), document.getElementById("stepIg")];
const go = document.getElementById("go"), goIcon = document.getElementById("goIcon"), goText = document.getElementById("goText");
const fill = document.getElementById("fill"), count = document.getElementById("count");
const done = new Set();

function safeGet(){ try { return localStorage.getItem(KEY); } catch { return null; } }
function safeSet(){ try { localStorage.setItem(KEY, "1"); } catch {} }

function refresh(){
  const n = done.size;
  count.textContent = n + "/2 Completados";
  fill.style.width = (n / 2 * 100) + "%";
  if (n === 2){
    go.classList.add("open");
    go.setAttribute("aria-disabled", "false");
    goIcon.className = "fa-solid fa-unlock";
    goText.textContent = "Ir a la página de juegos";
    safeSet();
  }
}

function markDone(btn){
  btn.classList.remove("checking"); btn.classList.add("done");
  btn.querySelector(".state").innerHTML = '<i class="fa-solid fa-circle-check"></i> Listo';
  done.add(btn.id); refresh();
}

steps.forEach(btn => btn.addEventListener("click", () => {
  window.open(btn.dataset.url, "_blank", "noopener");
  btn.classList.add("checking");
  btn.querySelector(".state").textContent = "Verificando…";
  setTimeout(() => markDone(btn), WAIT_MS);
}));

go.addEventListener("click", e => { if (!go.classList.contains("open")) e.preventDefault(); });

// Si ya los completó antes, pasa directo
if (safeGet() === "1") location.replace(GAMES_PAGE);
</script>
</body>
</html>
